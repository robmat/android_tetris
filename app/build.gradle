plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.github.triplet.play'
    id 'com.batodev.releasetools'
    id 'io.gitlab.arturbosch.detekt'
}

def keystorePropertiesFile = rootProject.file("../keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def versionProps = new Properties()
file("version.properties").withInputStream { versionProps.load(it) }

android {
    compileSdk = 37

    defaultConfig {
        applicationId = "com.batodev.tetris"
        minSdk = 23
        targetSdk = 37
        versionCode = versionProps.getProperty("versionCode").toInteger()
        versionName = versionProps.getProperty("versionName")

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    buildFeatures {
        viewBinding = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    namespace 'com.batodev.tetris'
}

play {
    serviceAccountCredentials.set(rootProject.file("../play-console-api-465319-0f9c399097c5.json"))
    track.set("internal")
    defaultToAppBundles.set(true)
}

detekt {
    buildUponDefaultConfig = true
    config.setFrom(files("$projectDir/config/detekt/detekt.yml"))
}

dependencies {
    detektPlugins libs.detekt.formatting

    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.preference.ktx
    implementation libs.chrisbanes.photoview
    implementation libs.play.services.ads
    implementation libs.google.play.review.ktx
    implementation libs.google.code.gson

    // Android X activities, fragments and ui elements
    implementation libs.androidx.navigation.fragment.ktx
    implementation libs.androidx.navigation.ui.ktx
    implementation libs.androidx.activity.ktx
    implementation libs.androidx.fragment.ktx
    implementation libs.androidx.lifecycle.viewmodel.compose

    // View extras
    implementation libs.androidx.core.splashscreen
    implementation libs.dionsegijn.konfetti.xml

    // Logic
    implementation files("tetris-2.3.0.jar")

    // Testing
    testImplementation libs.junit
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.espresso.core
    androidTestImplementation libs.androidx.test.espresso.intents
}
