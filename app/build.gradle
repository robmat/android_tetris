plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.batodev.releasetools'
    id 'io.gitlab.arturbosch.detekt'
}

def keystorePropertiesFile = rootProject.file("../keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def versionProps = new Properties()
file("version.properties").withInputStream { versionProps.load(it) }

android {
    compileSdk = 37

    defaultConfig {
        applicationId = "com.batodev.tetris"
        minSdk = 23
        targetSdk = 37
        versionCode = versionProps.getProperty("versionCode").toInteger()
        versionName = versionProps.getProperty("versionName")

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    // androidTest sources attach only to the variant named here, so keep the default on debug:
    // that is what Android Studio selects, what marks app/src/androidTest as a test source root,
    // and what keeps local test runs fast (no R8 pass per run).
    // Run with -PminifiedTests to point the suite at releaseTest instead - the same R8 output as
    // release, which is what catches release-only breakage (see proguard-rules-test.pro).
    testBuildType = project.hasProperty('minifiedTests') ? 'releaseTest' : 'debug'
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }

        // Same R8 pipeline and signing as release, plus keeps that only the instrumentation
        // harness needs - so the release APK users get stays fully shrunk and obfuscated.
        releaseTest {
            initWith release
            matchingFallbacks = ['release']
            proguardFile 'proguard-rules-test.pro'
        }
    }
    buildFeatures {
        viewBinding = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace 'com.batodev.tetris'
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

detekt {
    buildUponDefaultConfig = true
    config.setFrom(files("$projectDir/config/detekt/detekt.yml"))
}

dependencies {
    detektPlugins libs.detekt.formatting

    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.preference.ktx
    implementation libs.chrisbanes.photoview
    implementation libs.play.services.ads
    // play-services-ads transitively pins the ancient androidx.work:work-runtime:2.7.0 -
    // override it so WorkManager's own WorkDatabase creation doesn't crash on real
    // devices (see sgtpuzzles' fix for the full incident writeup).
    implementation libs.androidx.work.runtime
    implementation libs.google.play.review.ktx
    implementation libs.google.code.gson

    // Android X activities, fragments and ui elements
    implementation libs.androidx.navigation.fragment.ktx
    implementation libs.androidx.navigation.ui.ktx
    implementation libs.androidx.activity.ktx
    implementation libs.androidx.fragment.ktx
    implementation libs.androidx.lifecycle.viewmodel.compose

    // View extras
    implementation libs.androidx.core.splashscreen
    implementation libs.dionsegijn.konfetti.xml

    // Logic
    implementation files("tetris-2.3.0.jar")

    // Testing
    // Something in the release graph drags in concurrent-futures-ktx 1.1.0, which predates
    // SuspendToFutureAdapter. androidx.test:core needs 1.2.0, but consistent resolution pins
    // androidTest to whatever release resolved - so R8 fails the androidTest minify with
    // "Missing class androidx.concurrent.futures.SuspendToFutureAdapter". Declaring it lifts both.
    releaseTestImplementation libs.androidx.concurrent.futures.ktx
    testImplementation libs.junit
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.espresso.core
    androidTestImplementation libs.androidx.test.espresso.intents
}
